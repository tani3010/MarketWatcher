 * .03 : 0;\n            range.start = min - pad;\n            range.end = max + pad;\n        } else console.error('backtesting: scale range error:', min, max, range);\n    };\n}\n\nclearTimeout(window._bt_autoscale_timeout);\n\nwindow._bt_autoscale_timeout = setTimeout(function () {\n    /**\n     * @variable cb_obj `fig_ohlc.x_range`.\n     * @variable source `ColumnDataSource`\n     * @variable ohlc_range `fig_ohlc.y_range`.\n     * @variable volume_range `fig_volume.y_range`.\n     */\n    \"use strict\";\n\n    let i = Math.max(Math.floor(cb_obj.start), 0),\n        j = Math.min(Math.ceil(cb_obj.end), source.data['ohlc_high'].length);\n\n    let max = Math.max.apply(null, source.data['ohlc_high'].slice(i, j)),\n        min = Math.min.apply(null, source.data['ohlc_low'].slice(i, j));\n    _bt_scale_range(ohlc_range, min, max, true);\n\n    if (volume_range) {\n        max = Math.max.apply(null, source.data['Volume'].slice(i, j));\n        _bt_scale_range(volume_range, 0, max * 1.03, false);\n    }\n\n}, 50);\n"},"id":"576593","type":"CustomJS"},{"attributes":{},"id":"576748","type":"StringFormatter"},{"attributes":{"coordinates":null,"formatter":{"id":"576631"},"group":null,"major_label_policy":{"id":"576632"},"ticker":{"id":"576404"},"visible":false},"id":"576403","type":"LinearAxis"},{"attributes":{},"id":"576756","type":"StringFormatter"},{"attributes":{"overlay":{"id":"576560"}},"id":"576555","type":"BoxZoomTool"},{"attributes":{},"id":"576750","type":"StringFormatter"},{"attributes":{"data":{"Close":{"__ndarray__":"rkfhehSuKEAK16NwPQosQHsUrkfh+idAhetRuB4FJkA9CtejcD0qQGZmZmZmZiZA9ihcj8L1IUDD9Shcj8IcQHsUrkfh+iRAexSuR+F6LUA9CtejcF1JQEjhehSuN1RAj8L1KFzvZUCkcD0K12dxQGZmZmZmnmhAMzMzMzPDdUCPwvUoXLNxQK5H4XoU9nJApHA9CteffUBcj8L1KCqHQNejcD0K/JJASOF6FK5PikBmZmZmZlSAQK5H4XoUfIVAAAAAAADWgUBxPQrXo2x8QFyPwvUoIH1AAAAAAAAkcUBxPQrXowhtQPYoXI/CTWlAMzMzMzOTXEApXI/C9VhhQGZmZmZm1ltAuB6F61F4YEBmZmZmZqZhQK5H4XoUJmNAUrgehevFcECF61G4HiFyQAAAAAAAcGpAexSuR+FSZ0Bcj8L1KCxlQIXrUbgeDWdAS
